<!doctype html>
<!-- THROWAWAY: Three admin account layouts on one route, selected by ?variant=A|B|C. Mock data only. -->
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit · 管理端账号 · 视觉原型</title>
<style>
:root{color-scheme:dark;--bg:#091f21;--panel:#142a29;--line:#29413e;--text:#e9e7d7;--muted:#a8b6ab;--accent:#ff873d;--serif:Georgia,'Songti SC','Noto Serif CJK SC',serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button,a,input,select,textarea{outline-offset:4px}button:focus-visible,a:focus-visible{outline:2px solid var(--accent)}button{color:var(--text);background:transparent;border:1px solid var(--line);padding:9px 17px;border-radius:3px}button:hover{background:#243d35}button.primary{background:var(--accent);color:#142120;border:0;font-weight:600}button:disabled{opacity:.4;cursor:not-allowed}input,select,textarea{width:100%;background:#0b2223;border:1px solid #40534c;color:var(--text);padding:10px 12px;border-radius:2px}label{display:grid;gap:7px;color:var(--muted);font-size:12px}h1,h2,h3,p{margin:0}h1{font:38px/1.3 var(--serif);letter-spacing:1px}h2{font:27px/1.4 var(--serif)}.mono,.eyebrow{font:11px/1.6 ui-monospace,monospace;letter-spacing:1.8px;color:var(--muted)}.muted{color:var(--muted)}.brand{font:italic 34px var(--serif);letter-spacing:-2px}.brand span{font:12px sans-serif;letter-spacing:2px;border-left:1px solid #62716a;margin-left:18px;padding-left:18px}.top{height:86px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 40px}.profile{display:flex;align-items:center;gap:12px;font-size:12px}.avatar{display:inline-grid;place-items:center;width:32px;height:32px;background:#33483d;color:#e0ddc7;border-radius:50%}.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:calc(100vh - 86px)}nav{padding:35px 20px;border-right:1px dashed var(--line)}nav .eyebrow{padding:0 16px;margin-bottom:20px}nav a,nav span.item{display:block;padding:12px 16px;color:var(--muted);text-decoration:none;margin:5px 0}nav a{background:#1d352e;color:var(--text);border-left:2px solid var(--accent)}nav small{display:block;margin:100px 16px 0;color:var(--muted)}main{padding:36px 42px 145px;min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;margin:16px 0 28px}.heading p{margin-top:9px;color:var(--muted)}.filters{display:grid;grid-template-columns:1fr 1.4fr 1fr auto;gap:16px;padding:22px 0 26px;align-items:end;border-top:1px solid var(--line)}.filters button{height:43px}.listhead{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}th{font-weight:400;color:var(--muted);font-size:11px;letter-spacing:1px;background:#102728}td,th{padding:17px 14px;border-bottom:1px solid var(--line)}td{font-size:13px}tbody tr:hover{background:#142e2c}.nick{font-weight:500}.status{font-size:11px;color:#bfceb1;background:#233c31;padding:4px 9px;border-radius:2px}.status.off{color:#c9c6b8;background:#303b35}.foot{padding-top:20px;font-size:12px;color:var(--muted)}.tablewrap{overflow-x:auto}.note{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:12px}.topnav{display:flex;gap:30px;align-items:center}.topnav span{color:var(--muted)}.topnav b{font-weight:400;color:var(--accent)}.bmain{max-width:1440px;margin:auto;padding-top:32px}.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px}.rail{border-left:1px dashed var(--line);padding-left:26px}.rail h2{margin:12px 0}.rail p{font-size:13px;color:var(--muted);margin:16px 0}.bigcount{font:80px var(--serif);padding:15px 0}.bmain h1{font-size:48px}.bmain .filters{grid-template-columns:1fr 1.2fr 1fr auto}.cmaster{display:grid;grid-template-columns:260px minmax(0,1fr);gap:56px}.cmaster .intro{padding-top:22px}.cmaster .intro h1{font-size:46px;margin:15px 0 24px}.cmaster .filters{grid-template-columns:1fr;gap:18px;margin-top:30px}.entry{display:grid;grid-template-columns:72px 1.2fr 1fr 90px;gap:20px;align-items:center;padding:25px 0;border-top:1px solid var(--line)}.entry h2{font-size:24px}.entry p{font-size:12px;color:var(--muted);margin-top:4px}.recordnum{font:18px var(--serif);color:var(--muted)}.statebox{min-height:285px;border-block:1px solid var(--line);display:grid;place-content:center;text-align:center;gap:14px}.statebox p{color:var(--muted)}.skeleton{height:15px;width:320px;background:#29403a;margin:8px}.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;background:#ece9dc;color:#142724;border-radius:7px;box-shadow:0 8px 35px #0006;display:flex;gap:12px;align-items:center;padding:10px 14px;white-space:nowrap}.controls button{border-color:#c0c7bb;color:#142724;padding:4px 10px}.controls button:hover{background:#d1d8cb}.controls select{background:#f8f5eb;color:#142724;width:auto;padding:5px 10px;border-color:#b8c2b6}.controls small{font:10px ui-monospace,monospace}.production .controls{display:none}dialog{background:var(--panel);color:var(--text);border:1px solid #526052;width:520px;padding:32px;max-height:90vh;overflow:auto}dialog::backdrop{background:#001113bf}dialog header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.wide{grid-column:1/-1}.hint{font-size:11px;color:var(--muted)}dialog footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 25px;background:#d9e0c8;color:#163328;z-index:30}.stateinfo{font-size:10px;color:#46594d}.badge{border:1px solid var(--line);padding:3px 9px;font-size:10px;color:var(--muted)}@media(max-width:1000px){.shell{grid-template-columns:165px 1fr}main{padding-inline:24px}.split{grid-template-columns:1fr}.rail{display:none}.cmaster{grid-template-columns:210px 1fr;gap:25px}.entry{grid-template-columns:45px 1fr 1fr}.entry .status{grid-column:2}.topnav{gap:15px}.controls{max-width:96vw;flex-wrap:wrap;justify-content:center;gap:6px}.stateinfo{display:none}}@media(max-width:650px){.shell,.cmaster{display:block}nav{display:none}.top{padding:0 20px}.topnav{display:none}.brand span{font-size:10px}.heading{align-items:flex-start;gap:12px}h1,.bmain h1,.cmaster .intro h1{font-size:30px}.filters,.bmain .filters{grid-template-columns:1fr 1fr}.cmaster .filters{grid-template-columns:1fr 1fr}.entry{gap:10px}.controls small{display:none}main{padding-bottom:180px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><div id="app"></div><div id="switcher" class="controls"></div>
<dialog id="create"><header><div><div class="eyebrow">NEW ACCOUNT</div><h2>新增管理端账号</h2></div><button id="close" aria-label="关闭新增表单">×</button></header><form id="createform"><div class="formgrid"><label>昵称 *<input name="nickName" required placeholder="例如：林舟"></label><label>手机号 *<input name="phoneNumber" required pattern="1[0-9]{10}" inputmode="tel" placeholder="11 位手机号"></label><label class="wide">初始密码 *<input name="password" required type="password" maxlength="20" pattern="[a-zA-Z0-9]+" autocomplete="new-password"><span class="hint">仅字母和数字，最多 20 位</span></label><label>身份 *<select name="identity" required><option value="platform_admin">平台管理员</option><option value="super_admin">超级管理员</option></select></label><label>状态 *<select name="status" required><option value="enable">启用</option><option value="disable">停用</option></select></label><label class="wide">备注<textarea name="remark" rows="3" placeholder="填写账号用途（选填）"></textarea></label></div><p class="hint" style="margin-top:20px">示例操作 · 仅在本次预览内保存，刷新后清除。</p><footer><button type="button" id="cancel">取消</button><button class="primary" id="save">创建账号</button></footer></form></dialog>
<script type="module">
const variants=['A','B','C'],names={A:'侧栏 · 工作表格',B:'顶栏 · 分栏工作台',C:'编辑式 · 账号名册'};let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants.includes(variant))variant='A';let mode='normal',filters={userId:'',phoneNumber:'',status:''};
let rows=[['1001','林舟','13800001001','super_admin','enable','系统日常维护'],['1002','陈以宁','13800001002','platform_admin','enable','字典与参数维护'],['1003','许知远','13800001003','platform_admin','enable','内部协作账号'],['1004','周青','13800001004','platform_admin','disable','历史测试账号'],['1005','沈南','13800001005','platform_admin','enable','业务配置维护'],['1006','方禾','13800001006','platform_admin','enable','日常内容配置']].map(([userId,nickName,phoneNumber,identity,status,remark])=>({userId,nickName,phoneNumber,identity,status,remark}));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const identity=v=>v==='super_admin'?'超级管理员':'平台管理员';const status=r=>`<span class="status ${r.status==='disable'?'off':''}">${r.status==='enable'?'● 启用':'○ 停用'}</span>`;const filtered=()=>rows.filter(r=>Object.entries(filters).every(([k,v])=>!v||r[k]===v));
function top(nav=false){return `<header class="top"><div class="brand">orbit<span>ADMIN</span></div>${nav?'<div class="topnav"><b>管理端账号</b><span>字典管理</span><span>参数管理</span></div>':''}<div class="profile"><span class="badge">示例数据</span><span class="avatar">林</span><span>林舟</span></div></header>`}
function filterHTML(){return `<form class="filters" id="filters"><label>账号 ID<input name="userId" value="${esc(filters.userId)}" placeholder="精确匹配"></label><label>手机号<input name="phoneNumber" value="${esc(filters.phoneNumber)}" placeholder="输入完整手机号"></label><label>状态<select name="status"><option value="">全部状态</option><option value="enable" ${filters.status==='enable'?'selected':''}>启用</option><option value="disable" ${filters.status==='disable'?'selected':''}>停用</option></select></label><button type="submit">查询 ↗</button></form>`}
function heading(){return `<div class="heading"><div><h1>管理端账号</h1><p>查看账号信息，维护系统的协作入口。</p></div><button class="primary add" ${mode==='disabled'?'disabled':''}>＋ 新增账号</button></div>`}
function list(cards=false){let data=mode==='empty'?[]:filtered();if(mode==='loading')return '<div class="statebox" aria-busy="true"><p>正在获取账号列表…</p><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';if(mode==='error')return '<div class="statebox" role="alert"><h2>账号列表暂时无法加载</h2><p>请求未完成，请稍后再试。</p><button id="retry">再试一次</button></div>';if(!data.length)return '<div class="statebox"><div class="eyebrow">NO RESULTS</div><h2>没有符合条件的账号</h2><p>试试其他手机号、账号 ID 或状态。</p><button id="clear">清除筛选</button></div>';let html=cards?data.map(r=>`<article class="entry"><div class="recordnum">${esc(r.userId)}</div><div><h2>${esc(r.nickName)}</h2><p>${identity(r.identity)}</p></div><div><span>${esc(r.phoneNumber)}</span><p>${esc(r.remark)||'—'}</p></div>${status(r)}</article>`).join(''):`<div class="tablewrap"><table><thead><tr><th>账号 ID</th><th>昵称</th><th>手机号</th><th>身份</th><th>状态</th><th>备注</th></tr></thead><tbody>${data.map(r=>`<tr><td class="muted">${esc(r.userId)}</td><td class="nick">${esc(r.nickName)}</td><td>${esc(r.phoneNumber)}</td><td>${identity(r.identity)}</td><td>${status(r)}</td><td class="muted">${esc(r.remark)||'—'}</td></tr>`).join('')}</tbody></table></div>`;return `<div class="listhead"><span>账号名录 / DIRECTORY</span><span>${data.length} 个账号</span></div>${html}<p class="foot">已显示全部 ${data.length} 个账号</p>`}
function VariantA(){return `${top()}<div class="shell"><nav><div class="eyebrow">WORKSPACE</div><a href="?variant=A" aria-current="page">01　管理端账号</a><span class="item">02　字典管理</span><span class="item">03　参数管理</span><small>ORBIT ADMIN<br>系统管理空间</small></nav><main><div class="eyebrow">工作空间 / 管理端账号</div>${heading()}${filterHTML()}${list()}</main></div>`}
function VariantB(){return `${top(true)}<main class="bmain"><div class="eyebrow">ADMINISTRATION / 01</div>${heading()}<div class="split"><section>${filterHTML()}${list()}</section><aside class="rail"><div class="eyebrow">ACCOUNT DIRECTORY</div><h2>让协作各有所属。</h2><p>从这里查看管理端账号，添加新的协作成员。</p><div class="bigcount">${String(rows.length).padStart(2,'0')}</div><p>个示例账号</p><div class="note">身份说明<p>超级管理员<br>平台管理员</p>当前页面仅展示账号信息与新增入口。</div></aside></div></main>`}
function VariantC(){return `${top(true)}<main><div class="cmaster"><section class="intro"><div class="eyebrow">THE DIRECTORY / 01</div><h1>管理端<br>账号名册</h1><p class="muted">每个账号，<br>都是系统的一位协作者。</p>${filterHTML()}<button class="primary add" ${mode==='disabled'?'disabled':''}>＋ 新增账号</button></section><section><div class="eyebrow" style="padding:22px 0">ORBIT / WORKSPACE MEMBERS</div>${list(true)}</section></div></main>`}
function render(){document.querySelector('#app').innerHTML=({A:VariantA,B:VariantB,C:VariantC}[variant])();document.querySelector('#switcher').innerHTML=`<small>视觉原型</small><button id="prev" aria-label="上一个方案">←</button><strong>${variant} · ${names[variant]}</strong><button id="next" aria-label="下一个方案">→</button><select id="mode" aria-label="预览状态">${Object.entries({normal:'正常',loading:'加载中',empty:'无结果',error:'请求失败',disabled:'新增不可用'}).map(([k,v])=>`<option value="${k}" ${mode===k?'selected':''}>${v}</option>`).join('')}</select><span class="stateinfo">${filtered().length} 条 · ${Object.values(filters).filter(Boolean).length} 个筛选 · 本地示例</span>`;document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.querySelector('#mode').onchange=e=>{mode=e.target.value;render()};document.querySelector('#filters').onsubmit=e=>{e.preventDefault();filters=Object.fromEntries(new FormData(e.target));render()};document.querySelectorAll('.add').forEach(b=>b.onclick=()=>document.querySelector('#create').showModal());let clear=document.querySelector('#clear');if(clear)clear.onclick=()=>{mode='normal';filters={userId:'',phoneNumber:'',status:''};render()};let retry=document.querySelector('#retry');if(retry)retry.onclick=()=>{mode='loading';render();setTimeout(()=>{mode='normal';render()},600)};console.info('Prototype state',{variant,mode,filters,visible:filtered().length,total:rows.length});}
function cycle(dir){variant=variants[(variants.indexOf(variant)+dir+3)%3];let url=new URL(location);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});for(const id of ['close','cancel'])document.querySelector('#'+id).onclick=()=>document.querySelector('#create').close();
document.querySelector('#createform').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));if(rows.some(r=>r.phoneNumber===data.phoneNumber)){e.target.elements.phoneNumber.setCustomValidity('手机号已经被占用');e.target.elements.phoneNumber.reportValidity();return}delete data.password;rows.push({...data,userId:String(1001+rows.length)});e.target.reset();document.querySelector('#create').close();mode='normal';filters={userId:'',phoneNumber:'',status:''};render();let toast=document.createElement('div');toast.className='toast';toast.setAttribute('role','status');toast.textContent='示例账号已创建 · 刷新后清除';document.body.append(toast);setTimeout(()=>toast.remove(),3000)};document.querySelector('[name=phoneNumber]').oninput=e=>e.target.setCustomValidity('');render();
</script></body></html>
