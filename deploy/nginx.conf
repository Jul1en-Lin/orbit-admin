# Orbit Admin - Nginx 生产主配置文件 (完整示例)
# 适用于 Docker 容器或独立主机直接作为主配置文件运行 (如 /etc/nginx/nginx.conf)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 后端网关 upstream
    upstream gateway_upstream {
        server 127.0.0.1:18080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # 静态产物目录
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 10m;

        # Gzip 压缩
        gzip on;
        gzip_min_length 1k;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
        gzip_vary on;

        # 1. 静态资源目录 (/assets/) - 缺失文件直接 404，严禁回退至 index.html
        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # 根目录图标等单文件静态资源 - 缺失直接 404
        location = /favicon.ico {
            try_files $uri =404;
            access_log off;
            log_not_found off;
        }

        # 2. 同源 API 代理至网关 (/api/ -> /admin/)
        location ^~ /api/ {
            proxy_pass http://gateway_upstream/admin/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_intercept_errors off;
        }

        location = /api {
            return 308 /api/;
        }

        # 3. 前端单页应用路由回退 (HTML5 History 模式)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }
}
