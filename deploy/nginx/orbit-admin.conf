# Orbit Admin - Nginx 生产站点配置
# 建议放置路径: /etc/nginx/conf.d/orbit-admin.conf

# 后端网关 upstream（默认指向本地 18080 端口，生产环境根据部署拓扑调整）
upstream gateway_upstream {
    server 127.0.0.1:18080;
    keepalive 32;
}

server {
    listen 18000;
    server_name localhost;

    # 静态产物目录（解压 dist 产物后的根路径）
    root /usr/share/nginx/html;
    index index.html;

    # 客户端请求体限制
    client_max_body_size 10m;

    # Gzip 压缩配置
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 1. 静态构建产物目录 (/assets/)
    # Vite 构建产物带有文件名哈希，支持长期强缓存。
    # 核心保障：静态文件缺失必须直接返回 404，严禁回退至 index.html
    # （避免脚本或样式加载失败时回退为 HTML，引起浏览器报 MIME 类型解析错误）
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 根目录图标等单文件静态资源，缺失直接返回 404
    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # 2. 同源 API 代理 (/api/)
    # 将前端 /api/ 请求代理转发至后端网关 /admin/，保持 URI 路径对齐
    # 独立 location 隔离：后端 404/502/504 等响应原样透传，绝不触发前端 try_files 回退
    location ^~ /api/ {
        # 注意 proxy_pass 末尾包含 /admin/，Nginx 会自动将匹配到的 /api/ 替换为 /admin/
        # 例如: /api/sys_user/login/password -> http://gateway_upstream/admin/sys_user/login/password
        proxy_pass http://gateway_upstream/admin/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 转发客户端真实连接信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时时间设置
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 关闭错误拦截，网关返回的任何状态码（包括 404/502）直接返回客户端，绝不回退至 index.html
        proxy_intercept_errors off;
    }

    # 兼容无末尾斜杠的 /api 请求，重定向至 /api/
    location = /api {
        return 308 /api/;
    }

    # 3. 前端单页应用路由回退 (HTML5 History 模式)
    # 所有深层页面路径（如 /accounts, /dicts, /arguments, /not-found 等）刷新时回退至 index.html
    # 入口 HTML 文件禁用强缓存，确保前端更新后客户端即时获取最新入口
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
